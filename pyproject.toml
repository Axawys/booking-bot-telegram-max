[project]
name = "booking-bot-telegram-max"
version = "0.1.0"
description = "Бот онлайн-записи клиентов для Telegram и MAX"
requires-python = ">=3.13"
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",
    "F",   # pyflakes
    "I",   # порядок импортов
    "B",   # bugbear: частые ошибки
    "UP",  # современный синтаксис
    "SIM", # упрощения
    "ASYNC",
]

[tool.ruff.lint.isort]
known-first-party = ["core", "db", "telegram_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
